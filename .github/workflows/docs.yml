name: Deploy Docs to GitHub Pages

on:
  push:
    tags:
      - 'immich-go-gui-v[0-9]*'  # Release Please tag format (since v1.2.0)
      - 'v[0-9]*'                 # Legacy tag format (v0.9.x – v1.1.x)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0

      - name: Synchronize Test Counts in Documentation
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/sync_test_count.py --sync

      - name: Build docs
        run: uv run mkdocs build --strict

      # mkdocs --strict validates markdown links, not image src attributes.
      # lychee catches missing local assets (favicon, screenshots) and broken URLs.
      - name: Link and asset check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --root-dir ${{ github.workspace }}/site
            --index-files index.html,.
            --remap '^file://.*/site/immich-go-gui(/.*)?$ file://${{ github.workspace }}/site$1'
            --exclude-path site/assets/javascripts
            --exclude-path site/assets/stylesheets
            --exclude-path site/search
            --exclude 'https://shitan198u.github.io/immich-go-gui/.*'
            'site/**/*.html'
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/immich-go-gui-v') ||
          startsWith(github.ref, 'refs/tags/v')
        with:
          path: site/

  deploy:
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/immich-go-gui-v') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
