name: CI Checks

on:
  push:
    branches: [ "master" ]

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 xvfb libegl1 libgl1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: ty Type Checker (core)
        run: uv run ty check core/

      - name: Version Sync Check
        run: uv run python scripts/sync_version.py --check

      - name: Test Count Sync Check
        id: test-count-sync
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ! uv run python scripts/sync_test_count.py --check; then
            echo "::warning title=Test Count Sync Mismatch::Documentation test counts do not match collected pytest output. Run 'uv run python scripts/sync_test_count.py --sync' to synchronize."
          fi

      - name: Pre-commit
        run: SKIP=ty-check,version-sync-check,test-count-sync-check uv run pre-commit run --all-files --show-diff-on-failure

  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Desktop Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 xvfb libegl1 libgl1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Run Tests with Coverage (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run uv run pytest --cov=core --cov-fail-under=75

      - name: Run Tests with Coverage (macOS / Windows)
        if: runner.os != 'Linux'
        run: uv run pytest --cov=core --cov-fail-under=75

  self-test:
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 xvfb libegl1 libgl1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Run packaged self-test entrypoint
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run uv run python app.py --self-test
