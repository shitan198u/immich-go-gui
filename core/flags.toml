# core/flags.toml
# Single source of truth for immich-go CLI flag definitions.
# Loaded once at import time by core/flag_registry.py.
# Validated against CLI help fixtures by tests/test_flag_registry.py.

schema_version = 1

# ────────────────────────────────────────────────────────────────
# Tab metadata
# ────────────────────────────────────────────────────────────────
[tabs.upload-folder]
command = ["upload", "from-folder"]
section = "upload"
server_required = true
serverless = false

[tabs.upload-gp]
command = ["upload", "from-google-photos"]
section = "upload"
server_required = true
serverless = false

[tabs.upload-icloud]
command = ["upload", "from-icloud"]
section = "upload"
server_required = true
serverless = false

[tabs.upload-picasa]
command = ["upload", "from-picasa"]
section = "upload"
server_required = true
serverless = false

[tabs.upload-immich]
command = ["upload", "from-immich"]
section = "upload"
server_required = true
serverless = false

[tabs.archive-folder]
command = ["archive", "from-folder"]
section = "archive"
server_required = false
serverless = true

[tabs.archive-gp]
command = ["archive", "from-google-photos"]
section = "archive"
server_required = false
serverless = true

[tabs.archive-icloud]
command = ["archive", "from-icloud"]
section = "archive"
server_required = false
serverless = true

[tabs.archive-picasa]
command = ["archive", "from-picasa"]
section = "archive"
server_required = false
serverless = true

[tabs.archive-immich]
command = ["archive", "from-immich"]
section = "archive"
server_required = true
serverless = false

[tabs.stack]
command = ["stack"]
section = "stack"
server_required = true
serverless = false

# ────────────────────────────────────────────────────────────────
# Secret env-var routing
# ────────────────────────────────────────────────────────────────
[secrets.upload-folder]
server = "IMMICH_GO_UPLOAD_SERVER"
api_key = "IMMICH_GO_UPLOAD_API_KEY"
admin_api_key = "IMMICH_GO_UPLOAD_ADMIN_API_KEY"

[secrets.upload-gp]
server = "IMMICH_GO_UPLOAD_SERVER"
api_key = "IMMICH_GO_UPLOAD_API_KEY"
admin_api_key = "IMMICH_GO_UPLOAD_ADMIN_API_KEY"

[secrets.upload-icloud]
server = "IMMICH_GO_UPLOAD_SERVER"
api_key = "IMMICH_GO_UPLOAD_API_KEY"
admin_api_key = "IMMICH_GO_UPLOAD_ADMIN_API_KEY"

[secrets.upload-picasa]
server = "IMMICH_GO_UPLOAD_SERVER"
api_key = "IMMICH_GO_UPLOAD_API_KEY"
admin_api_key = "IMMICH_GO_UPLOAD_ADMIN_API_KEY"

[secrets.upload-immich]
server = "IMMICH_GO_UPLOAD_SERVER"
api_key = "IMMICH_GO_UPLOAD_API_KEY"
admin_api_key = "IMMICH_GO_UPLOAD_ADMIN_API_KEY"
from_server = "IMMICH_GO_UPLOAD_FROM_IMMICH_FROM_SERVER"
from_api_key = "IMMICH_GO_UPLOAD_FROM_IMMICH_FROM_API_KEY"
from_admin_api_key = "IMMICH_GO_UPLOAD_FROM_IMMICH_FROM_ADMIN_API_KEY"

[secrets.archive-immich]
from_server = "IMMICH_GO_ARCHIVE_FROM_IMMICH_FROM_SERVER"
from_api_key = "IMMICH_GO_ARCHIVE_FROM_IMMICH_FROM_API_KEY"
from_admin_api_key = "IMMICH_GO_ARCHIVE_FROM_IMMICH_FROM_ADMIN_API_KEY"

[secrets.stack]
server = "IMMICH_GO_STACK_SERVER"
api_key = "IMMICH_GO_STACK_API_KEY"
admin_api_key = "IMMICH_GO_STACK_ADMIN_API_KEY"

# ────────────────────────────────────────────────────────────────
# Per-tab flag definitions
# ────────────────────────────────────────────────────────────────

# ── upload-folder (30 flags) ──────────────────────────────────
[[flags.upload-folder]]
key = "path"
flag = ""
label = "Source path"
kind = "path"
mode = "simple"

[[flags.upload-folder]]
key = "server"
flag = "server"
label = "Immich server URL"
kind = "text"
mode = "simple"

[[flags.upload-folder]]
key = "skip-ssl"
flag = "skip-verify-ssl"
label = "Skip SSL verification"
kind = "bool"
default = false
mode = "simple"

[[flags.upload-folder]]
key = "dry-run"
flag = "dry-run"
label = "Dry run mode"
kind = "bool"
default = false
mode = "simple"

[[flags.upload-folder]]
key = "concurrent-tasks"
flag = "concurrent-tasks"
label = "Concurrent upload tasks"
kind = "int"
min = 1
max = 20
mode = "advanced"

default = 16
[[flags.upload-folder]]
key = "device-uuid"
flag = "device-uuid"
label = "Device UUID"
kind = "text"
mode = "advanced"

default = ""
[[flags.upload-folder]]
key = "folder-album"
flag = "folder-as-album"
label = "Folder as album mode"
kind = "enum"
options = ["NONE", "FOLDER", "PATH"]
default = "NONE"
mode = "simple"

[[flags.upload-folder]]
key = "into-album"
flag = "into-album"
label = "Put all into Album"
kind = "text"
placeholder = "e.g. Family Archive"
mode = "simple"

[[flags.upload-folder]]
key = "manage-burst"
flag = "manage-burst"
label = "Burst Photos"
kind = "enum"
options = ["NoStack", "Stack", "StackKeepRaw", "StackKeepJPEG"]
default = "NoStack"
mode = "simple"

warn_values = { Stack = "Stack may discard non-cover burst frames when stacking.", StackKeepRaw = "StackKeepRaw may discard non-cover burst frames when stacking.", StackKeepJPEG = "StackKeepJPEG may discard non-cover burst frames when stacking." }
[[flags.upload-folder]]
key = "manage-raw-jpeg"
flag = "manage-raw-jpeg"
label = "RAW + JPEG Pairs"
kind = "enum"
options = ["NoStack", "KeepRaw", "KeepJPG", "StackCoverRaw", "StackCoverJPG"]
default = "NoStack"
mode = "simple"

warn_values = { KeepJPG = "KeepJPG may delete the RAW file when stacking pairs.", KeepRaw = "KeepRaw may delete the JPEG file when stacking pairs." }
[[flags.upload-folder]]
key = "manage-heic-jpeg"
flag = "manage-heic-jpeg"
label = "HEIC + JPEG Pairs"
kind = "enum"
options = ["NoStack", "KeepHeic", "KeepJPG", "StackCoverHeic", "StackCoverJPG"]
default = "NoStack"
mode = "simple"

[[flags.upload-folder]]
key = "recursive"
flag = "recursive"
label = "Scan subdirectories recursively"
kind = "bool"
default = true
mode = "advanced"

[[flags.upload-folder]]
key = "date-from-name"
flag = "date-from-name"
label = "Use date from filename"
kind = "bool"
default = true
mode = "advanced"

[[flags.upload-folder]]
key = "ignore-sidecar"
flag = "ignore-sidecar-files"
label = "Ignore sidecar files"
kind = "bool"
default = false
mode = "advanced"

[[flags.upload-folder]]
key = "time-zone"
flag = "time-zone"
label = "Time zone override"
kind = "text"
placeholder = "UTC or America/New_York"
mode = "advanced"

[[flags.upload-folder]]
key = "album-path-joiner"
flag = "album-path-joiner"
label = "Album path joiner"
kind = "text"
placeholder = " / "
mode = "advanced"

[[flags.upload-folder]]
key = "date-range"
flag = "date-range"
label = "Date range"
kind = "date_range"
placeholder = "YYYY-MM-DD,YYYY-MM-DD"
mode = "advanced"

[[flags.upload-folder]]
key = "include-ext"
flag = "include-extensions"
label = "Include extensions"
kind = "extensions"
placeholder = ".jpg,.heic,.mp4"
mode = "advanced"

[[flags.upload-folder]]
key = "exclude-ext"
flag = "exclude-extensions"
label = "Exclude extensions"
kind = "extensions"
placeholder = ".thm,.xmp"
mode = "advanced"

[[flags.upload-folder]]
key = "client-timeout"
flag = "client-timeout"
label = "Client timeout"
kind = "duration_minutes"
mode = "advanced"
hidden = true
default = 60

[[flags.upload-folder]]
key = "ban-file"
flag = "ban-file"
label = "Skip files matching patterns"
kind = "lines_repeat"
placeholder = "@eaDir/\n.DS_Store"
mode = "advanced"

[[flags.upload-folder]]
key = "tag"
flag = "tag"
label = "Custom tags"
kind = "csv_repeat"
placeholder = "vacation, family/reunion"
mode = "advanced"

[[flags.upload-folder]]
key = "session-tag"
flag = "session-tag"
label = "Session tag"
kind = "bool"
default = false
mode = "advanced"

[[flags.upload-folder]]
key = "folder-tags"
flag = "folder-as-tags"
label = "Folder as tags"
kind = "bool"
default = false
mode = "advanced"

[[flags.upload-folder]]
key = "overwrite"
flag = "overwrite"
label = "Overwrite existing"
kind = "bool"
default = false
mode = "advanced"
warn_values = { true = "Overwrite mode will replace existing files on the server." }

[[flags.upload-folder]]
key = "pause-jobs"
flag = "pause-immich-jobs"
label = "Pause Immich background jobs"
kind = "bool"
default = true
mode = "advanced"

[[flags.upload-folder]]
key = "manage-epson"
flag = "manage-epson-fastfoto"
label = "Manage Epson FastFoto photos"
kind = "bool"
default = false
mode = "advanced"

[[flags.upload-folder]]
key = "include-type"
flag = "include-type"
label = "Media type"
kind = "enum"
options = ["all", "IMAGE", "VIDEO"]
default = "all"
mode = "advanced"

[[flags.upload-folder]]
key = "on-errors"
flag = "on-errors"
label = "On errors"
kind = "text"
default = "stop"
placeholder = "stop | continue | or a max error count, e.g. 10"
hint = "immich-go accepts stop, continue, or a non-negative integer (abort after N errors)."

mode = "advanced"
[[flags.upload-folder]]
key = "log-level"
flag = "log-level"
label = "Log level"
kind = "enum"
options = ["INFO", "DEBUG", "WARN", "ERROR"]
default = "INFO"
mode = "advanced"

[[flags.upload-folder]]
key = "api-trace"
flag = "api-trace"
label = "Enable API trace"
kind = "bool"
default = false
mode = "advanced"

[[flags.upload-folder]]
key = "no-ui"
flag = "no-ui"
label = "Headless mode"
kind = "bool"
default = false
mode = "advanced"
hidden = true
