name: "immich-go-gui"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "shitan198u <shitan198u@users.noreply.github.com>"
vendor: "shitan198u"
homepage: "https://github.com/shitan198u/immich-go-gui"
license: "MIT"
description: |
  Desktop GUI for immich-go bulk media operations.
  Immich-Go GUI is an unofficial, user-friendly graphical interface for
  the immich-go CLI tool. It simplifies uploading, archiving, and organizing
  photos and videos on your Immich server.
contents:
  - src: ../../app.dist
    dst: /opt/immich-go-gui
  - src: ../../immich-go-gui.png
    dst: /usr/share/pixmaps/immich-go-gui.png
  - src: ../../immich-go-gui.png
    dst: /usr/share/icons/hicolor/512x512/apps/immich-go-gui.png
  - src: ./immich-go-gui.desktop
    dst: /usr/share/applications/immich-go-gui.desktop
  - src: ./immich-go-gui.metainfo.xml
    dst: /usr/share/metainfo/immich-go-gui.metainfo.xml
  - src: ../../LICENSE.txt
    dst: /usr/share/doc/immich-go-gui/copyright
  - src: ../../LICENSE.txt
    dst: /usr/share/licenses/immich-go-gui/LICENSE
deb:
  fields:
    License: "MIT"
rpm:
  group: "Applications/Graphics"
  summary: "Desktop GUI for immich-go bulk media operations"
