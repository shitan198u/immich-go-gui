[project]
name = "immich-go-gui"
version = "1.1.2"
description = "Cross-platform desktop GUI for immich-go — configure, preview, and launch Immich media upload, archive, and stack workflows."
readme = "README.md"
requires-python = ">=3.13.0, <3.14"
dependencies = [
    "keyring>=25.0.0",
    "packaging>=24.0.0",
    "psutil>=6.1.1",
    "pyside6>=6.8.2",
    "requests>=2.32.3",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "cairosvg>=2.7.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-material[imaging]>=9.7.7",
    "nuitka>=4.1.3",
    "pillow>=10.4.0",
    "pre-commit>=4.6.0",
    "pyfakefs>=5.5.0",
    "pymdown-extensions>=10.14",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
