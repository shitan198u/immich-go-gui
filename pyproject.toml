[project]
name = "immich-go-gui"
version = "1.1.2"
description = "Cross-platform desktop GUI for immich-go — configure, preview, and launch Immich media upload, archive, and stack workflows."
readme = "README.md"
requires-python = ">=3.13.0, <3.14"
dependencies = [
    "idna>=3.15",
    "keyring>=25.0.0",
    "packaging>=24.0.0",
    "pyside6>=6.8.2",
    "requests>=2.33.0",
    "tomli-w>=1.2.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "cairosvg>=2.7.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-material[imaging]>=9.7.7",
    "nuitka>=4.1.3",
    "pillow>=10.4.0",
    "pre-commit>=4.6.0",
    "pyfakefs>=5.5.0",
    "pymdown-extensions>=10.14",
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "integration: end-to-end tests that execute real subprocesses",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["core", "gui"]
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
