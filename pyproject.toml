[project]
name = "immich-go-gui"
version = "1.3.0"
description = "Cross-platform desktop GUI for immich-go — configure, preview, and launch Immich media upload, archive, and stack workflows."
readme = "README.md"
requires-python = ">=3.13.0, <3.14"
dependencies = [
    "idna>=3.15",
    "keyring>=25.0.0",
    "packaging>=24.0.0",
    "pyside6>=6.8.2",
    "requests>=2.33.0",
    "tomli-w>=1.2.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "cairosvg>=2.7.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-material[imaging]>=9.7.7",
    "nuitka>=4.1.3",
    "pillow>=10.4.0",
    "pre-commit>=4.6.0",
    "pyfakefs>=5.5.0",
    "pymdown-extensions>=10.14",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
# Default run excludes integration + live_cli (require real subprocess/binary);
# unit + gui + theme + security + slow stay opt-in-only on-demand.
addopts = "-ra --strict-markers --durations=20 -m 'not integration and not live_cli'"
markers = [
    "integration: end-to-end tests that execute real subprocesses",
    "live_cli: tests that require a real immich-go binary",
    "gui: Qt widget tests",
    "theme: tests that require real theme/icon rendering",
    "security: security-invariant tests",
    "unit: pure-core tests that do not require the Qt application",
    "slow: tests that are slow to run",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "RUF", "SIM", "DTZ", "PERF"]
ignore = [
    "BLE001",   # Allow generic Exception catching for Qt GUI fallbacks, OS keyring fallback, & teardown
    "S110",     # Allow try-except-pass for non-critical OS feature detection & cleanup
    "PLW0603",  # Allow cached global template in theme.py
    "PLW2901",  # Allow reassignment of loop variables in line stripping loops
    "PLR2004",  # Allow magic constants in comparisons/tests
    "PLC0415",  # Allow lazy imports inside functions/tests
    "E501",     # Line length handled by ruff format
    "PLR0912",  # Allow branch counts in complex GUI builder methods
    "PLR0913",  # Allow function argument count for build_plan_from_state & build_environment
    "PLR0915",  # Allow statement counts in declarative Qt layout builders
    "PLR0917",  # Allow positional argument counts
    "PLR0911",  # Allow return statement counts in complex dispatch functions
    "PLR1714",  # Allow explicit OR comparisons
    "RUF001",   # Allow unicode icons (e.g. ℹ️) in UI banners
    "RUF005",   # Allow list concatenation using +
    "PLW0108",  # Allow explicit lambda slots in Qt signal connections
    "SIM108",   # Allow explicit if-else blocks for UI paint layout calculation
    "SIM105",   # Allow try-except-pass blocks
    "SIM102",   # Allow nested if statements for readability
    "PLR5501",  # Allow else-if constructs
    "SIM910",   # Allow explicit dict.get default parameters
    "PERF401",  # Allow explicit list appends
    "PERF402",  # Allow explicit list copies
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLW1510", "PLR0911", "PLR1714", "RUF005", "RUF012", "RUF059", "SIM117", "E402", "SIM105"]
"scripts/*" = ["E402", "PLW1510", "RUF005", "PERF401"]

[tool.ty.src]
# Type-check only `core/`. The Qt GUI mixins in `gui/` rely on runtime
# composition (host attributes on `self`) that yields false positives under
# strict static analysis — see `.agents/AGENTS.md`.
include = ["core"]

[tool.ty.rules]
unresolved-import = "warn"
unresolved-attribute = "warn"

[tool.ty.terminal]
error-on-warning = false
