repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=2000'] # Allows up to 2MB (for your PNG files)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: uv run ty check core/
        language: system
        pass_filenames: false
        files: ^core/
      - id: version-sync-check
        name: version-sync-check
        entry: uv run python scripts/sync_version.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: test-count-sync-check
        name: test-count-sync-check
        entry: uv run python scripts/sync_test_count.py --check
        language: system
        pass_filenames: false
        always_run: true
